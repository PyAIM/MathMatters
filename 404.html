<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MathMatters</title>
  <script>
    // GitHub Pages SPA redirect
    // When GitHub serves this 404 page, encode the requested path as ?p=
    // and redirect to index.html so the React app can handle routing.
    // segmentCount = 0 because the site is served from the root domain
    // math-matters.net (no sub-path prefix).
    var segmentCount = 0;
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
      "/?p=/" +
      l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
      (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
