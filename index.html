    <script>
      // Restore route after GitHub Pages 404.html redirect
      (function () {
        var p = window.location.search.slice(1).split("&").find(function (s) {
          return s.startsWith("p=/") || s === "p=";
        });
        if (p) {
          var path = p.slice(2).replace(/~and~/g, "&");
          var remaining = window.location.search
            .slice(1)
            .split("&")
            .filter(function (s) {
              return !s.startsWith("p=") && !s.startsWith("q=");
            });
          var q = window.location.search
            .slice(1)
            .split("&")
            .find(function (s) {
              return s.startsWith("q=");
            });
          history.replaceState(
            null,
            null,
            window.location.pathname +
              path +
              (remaining.length ? "?" + remaining.join("&") : "") +
              (q ? (remaining.length ? "&" : "?") + q.slice(2).replace(/~and~/g, "&") : "") +
              window.location.hash
          );
        }
      })();
    </script>
